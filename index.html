.t{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.opt{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.92rem;margin:10px 0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.92rem;margin-bottom:10px}
.debt{letter-spacing:3px}.debt i{font-style:normal;opacity:.25}.debt i.on{opacity:1;color:var(--bad)}
.gauge{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.gauge div{height:100%;background:var(--acc2);width:0;transition:width .4s}
.gl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);margin:4px 0 14px}
.clock{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.clock div{height:100%;background:var(--acc);width:100%}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px}
.q h2{margin-bottom:14px}
.a{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}

.rev p:first-child{font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

"İmtahana buraxılmayan tələbə dərslərin 50 faizindən çoxunda iştirak etmişsə, fənni yay semestrində təkrar götürə bilər (3.4.8).",
"Üzrlü səbəblə imtahana gəlməyən tələbəyə növbəti semestrin dərsləri başlanana qədər bir dəfə imtahan vermək imkanı yaradılır və bunun üçün ödəniş tutulmur. Bu imkandan istifadə etməyən tələbə üzrsüz səbəbdən iştirak etməyən sayılır (3.2.14, 3.2.20).",
"Akademik borcu olan tələbə hər semestrdə fənni dinləmədən ümumilikdə iki fənn üzrə (hər fəndən bir dəfə) imtahan verə bilər (3.2.14).",
"Təkrar imtahan haqqı fənn üçün 4.3-cü bəndə uyğun müəyyən edilən məbləğin 25 faizindən çox ola bilməz (3.2.14).",
"Kreditləri vaxtında yığa bilməyən tələbə xaric edilmir. O, kontingentdə saxlanılır və təhsilini yalnız ödənişli əsaslarla davam etdirir (4.3).",
"Ödəniş məbləği illik təhsil haqqını 60-a bölərək alınan nəticəni tələbənin götürdüyü fənlərin kreditlərinə vurmaqla hesablanır (4.3). 60 rəqəmi bir ildəki 2 semestr × 30 krediti ifadə edir.",
"Normativ müddətdən sonrakı 3 ildə kreditləri toplaya bilməyən tələbə yalnız məzmununda əsaslı dəyişikliklər edilən peşə hazırlığı fənlərindən əvvəl qazandığı kreditləri itirir və onları yenidən yığmalıdır (3.2.15).",
"Cari semestrdə akademik borcu qalan tələbə növbəti semestrdə təqaüddən məhrum olur. Bütün fənlərdən kreditləri qazandıqda təqaüd növbəti semestrdən bərpa olunur (3.2.24).",
"Müvəffəq qiyməti yüksəltmək üçün yenidən imtahan verməyə icazə yoxdur. Tələbə fənni yay semestrində yenidən götürüb dinləməklə imtahan verir. Məqsədinə nail olmasa, əvvəlki bal qüvvədə qalır (3.4.7).",
"Bir semestrdə götürülən kreditlərin sayı bütün hallarda 40-dan çox olmamalıdır. Əlavə fənn ödənişlidir. Dövlət sifarişi ilə oxuyan və 81–100 bal toplayan tələbələr əlavə fənni ödənişsiz seçə bilər (3.2.5).",
"Fənlərin və kreditlərin ən azı 70 faizi eyni olduqda tələbə ödənişli əsaslarla müvafiq ixtisasın fənlərini seçə bilər. Bu şərtlərlə əlavə təhsil alanlara həmin ixtisas üzrə bakalavr dərəcəsi və diplom verilir (3.2.6).",
"Digər ali təhsil müəssisələrində qazanılacaq kreditlərin sayı ixtisas üzrə kreditlərin 30 faizindən çox olmamalıdır. Bu, tələbənin öz müəssisəsinin razılığı ilə həyata keçirilir (6.1).",
"Akademik mobillik üçün akademik transkript, tələbənin ərizəsi, tədris razılığı və məlumat paketi tələb olunur (6.2). Tibbi arayış bu siyahıda yoxdur.",
"Parttime formada ixtisasın tədris planına uyğun hər semestrdə iki fəndən az olmamaqla oxunur və tədris qrafikini tələbə özü planlaşdırır. Fulltime formada isə qrafiki ali məktəb planlaşdırır (2.1.18, 2.1.19).",
"Qaydalar ali təhsil müəssisələrinin tabeliyindən, mülkiyyət növündən və təşkilati-hüquqi formasından asılı olmayaraq hamısına şamil edilir (1.2). Xarici ali məktəblərin filialları öz ölkələrinin tədris qaydalarını tətbiq edə bilər.",
"Kredit sistemində hər tələbənin fərdi tədris planı olur, çoxballı qiymətləndirmə aparılır və hər fənn üzrə ayrıca jurnal tərtib edilir (1.3). Hamı üçün eyni dəyişməz plan bu sistemin xüsusiyyəti deyil.",
"Kredit sisteminin xüsusiyyətlərindən biri tədris qruplarının hər semestrdə fənlər üzrə formalaşdırılmasıdır (1.3.6).",
"Təhsilalma müddətinin tələbənin nailiyyətindən asılı olması kredit sisteminin xüsusiyyətlərindəndir (1.3.9). Xüsusi təyinatlı ali təhsil müəssisələri istisnadır.",
"Təhsil krediti fənnin məzmununa və həcminə uyğun olaraq onun mənimsənilməsinə ayrılan vaxtın ölçü vahididir (2.1.1).",
"Akademik transkript tələbənin keçdiyi fənlər üzrə topladığı kreditləri və qiymətləri (rəqəm və hərflərlə) əks etdirir (2.1.12). Tələbə onu təhsil müddətində istənilən vaxt ala bilər (4.5).",
"Prerekvizit fənlər tədrisi ilk növbədə zəruri olan fənlərdir (2.1.11). Fərdi plan tərtib olunarkən prerekvizitliyə riayət edilməlidir (3.2.11).",
"Akademik borclu tələbə fərdi planda qeyd olunan fənlərin ən azı birindən müəyyən olunmuş krediti qazana bilməyən tələbədir (2.1.17).",
"AKTS Avropa Kredit Transfer Sistemidir. O, tələbənin iş yükünü və təhsilalma istiqamətini müəyyənləşdirir, mobilliyi təmin edir və proqramların dövlətlərarası müqayisəsini asanlaşdırır (2.1.10).",
"Aralıq qiymətləndirmə imtahan zamanı tələbənin bilik və bacarıqlarının qiymətləndirilməsidir (2.1.21). Semestr boyu fəaliyyətin qiymətləndirilməsi isə cari qiymətləndirmədir (2.1.20).",
"Tədris ili payız və yaz semestrlərindən ibarətdir. Yay tətili müddətində 6 həftədən çox olmayan yay semestri də təşkil oluna bilər (3.2.1).",
"Tədris sənədləri ixtisasın tədris planı, tədris qrafiki, illik işçi tədris planı, tələbənin fərdi planı və müəllimin illik işçi planıdır (3.1.2). Dekanlığın maliyyə hesabatı bu siyahıda yoxdur.",
"Fənlər üç qrupa bölünür: məcburi və ardıcıl öyrənilənlər, məcburi, lakin ardıcıllığı vacib olmayanlar və tələbənin seçimi ilə öyrənilənlər (3.2.8).",
"Kreditlər auditoriya və auditoriyadankənar iş, təcrübə, laboratoriya, kurs işi, imtahanlara hazırlıq və imtahan, buraxılış işi və dövlət imtahanı üzrə müəyyənləşdirilir (3.2.7). İctimai tədbirlər bu siyahıda yoxdur.",
"Müvəffəqiyyətlə təhsil alan tələbə fərdi planda qeyd olunan bütün fənlər üzrə müəyyən olunmuş kreditləri qazanan tələbədir (2.1.16).",
"Üzrlü və ya üzrsüz səbəbdən imtahanda iştirak etməyən tələbə həmin fəndən kreditləri qazanmır və akademik borcu qalır. Üzrlü səbəb olduqda isə təkrar imtahan imkanı yaradılır (3.2.14).",
"Növbəti ilin fərdi planına ilk növbədə əvvəlki ildən akademik borcu qalan fənlər daxil edilir. Fənn həmin semestrdə tədris olunmursa və ya qrup yaradılmırsa, bu tələb istisna edilir (3.2.11).",
"Fərdi tədris planını tələbənin özü fənlərin prerekvizitliyini nəzərə almaqla tərtib edir. Bu zaman akademik məsləhətçinin (tyutorun) köməyindən də istifadə oluna bilər (3.2.11).",
"Yeni qəbul olunan tələbələrə birinci tədris ili üçün fərdi plan fakültə tərəfindən hazırlanır və tələbə onu sentyabrın 10-dək almalıdır. Həmin tarixədək düzəlişlər də edə bilər (3.3.1).",
"Plan təqdim edilmədikdə tələbənin təhsili həmin il üçün ixtisasın tədris qrafikinə uyğun təşkil edilir (3.3.4).",
"Qrupda tələbə sayını fənnin xüsusiyyətindən və tədris formasından asılı olaraq müəssisə müəyyən edir. Say yığılmayan fənn illik işçi plana daxil edilmir və tələbələr planlarını müvafiq qaydada dəyişirlər (3.3.3).",
"Sərbəst işin ən azı 40 faizi müəllimin rəhbərliyi ilə dərsdənkənar vaxtda həyata keçirilməlidir. Əyani formada bütün növ dərslərin 1 akademik saatına 1 saatdan az olmayaraq sərbəst iş müəyyən edilir (3.2.21).",
"Müəllimin tələbələrlə sərbəst işi onun tədris-metodiki işi hesab edilir (3.2.21).",
"Sərbəst işin növü və forması fənni tədris edən müəllim tərəfindən müəyyənləşdirilir (3.2.22).",
"Yay semestrində üzrlü səbəbdən imtahanda iştirak etməyən tələbələr üçün növbəti semestrin başlanğıcına qədər bir dəfə imtahan təşkil olunur (3.4.5).",
"Müəllimlər yay semestrinə könüllü cəlb olunurlar. Fəaliyyət saathesabı qaydada ödənilir, bundan əlavə fənn üzrə qrupdan əldə olunan vəsait hesabına əlavə ödəniş verilir. Məbləği müəssisə müəyyən edir (3.4.12).",
"Yay semestri yaz semestri başa çatdıqdan sonra təşkil olunur və başlanma müddətini ali təhsil müəssisəsi müəyyən edir (3.4.2).",
"Tyutor rektorun əmri ilə təyin olunur (5.3). Tyutorlar bu sahədə müəyyən təcrübəsi və səriştəsi olan ali təhsilli şəxslər arasından seçilir (5.2).",
"Tyutor tələbələrin hüquq və akademik maraqlarını qoruyur, məlumat və sənədlər təqdim edir, fərdi planların tərtibinə məsləhət verir, yay semestrinin təşkilində iştirak edir (5.4). Qiymət müəyyən etmək onun vəzifəsi deyil.",
"Tələbənin müəllim seçmək hüququ var. Bir müəllimi seçən tələbələrin sayını fənnin xüsusiyyətindən və tədrisin formasından asılı olaraq ali təhsil müəssisəsi müəyyən edir (3.2.17, 4.2-1)."
];
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let S,tm,tl,train=false;
function menu(){
 clearInterval(tm);
 const best=bestPts();
 app.innerHTML=nav()+`<h1>Ali təhsil müəssisələrində kredit sistemi ilə tədrisin təşkili qaydalarını oyunla öyrən.</h1>
 <p class="mute">Hər düzgün cavab kredit qazandırır, hər səhv cavab isə akademik borc yaradır. 3 borc yığsan sessiya bitir.</p>
 ${best?`<p><b>Ən yüksək xal:</b> ${best}</p>`:""}
 <label class="opt"><input type="checkbox" id="tr"> Təlim rejimi (vaxt və borc limiti yoxdur)</label>
 <div class="topics">
 <button class="t" data-t="-1" data-n="15"><b>Qarışıq oyun</b><span>15 sual</span></button>
 <button class="t" data-t="-2" data-n="60"><b>Tam imtahan</b><span>60 sual</span></button>
 ${T.map((n,i)=>`<button class="t" data-t="${i}" data-n="99"><b>${n}</b><span>${Q.filter(q=>q[0]==i).length} sual</span></button>`).join("")}
 </div>`;
 app.querySelectorAll(".t").forEach(b=>b.onclick=()=>start(+b.dataset.t,+b.dataset.n));
}
function start(t,n){
 train=$("#tr").checked;
 let p=Q.map((q,i)=>i).filter(i=>t<0||Q[i][0]==t);
 p=shuf(p).slice(0,n);window.MODE=t==-1?"Qarışıq":t==-2?"Tam imtahan":T[t];
 S={p,i:0,pts:0,cr:0,debt:0,st:0,bad:[],left:20,done:false};
 ask();
}
function ask(){
 if(S.i>=S.p.length||(!train&&S.debt>=3))return end();
 const q=Q[S.p[S.i]];
 S.o=shuf([2,3,4,5]).map(k=>({t:q[k],ok:k==2}));
 S.left=60;S.done=false;
 app.innerHTML=`<div class="hud"><span>Sual ${S.i+1} / ${S.p.length}</span><span class="debt" title="Akademik borc">${[0,1,2].map(i=>`<i class="${S.debt>i?"on":""}">●</i>`).join("")}</span><span><b>${S.pts}</b> xal</span></div>
 <div class="gauge"><div style="width:${Math.min(100,S.cr/S.p.length*100)}%"></div></div>
 <div class="gl"><span>${S.cr} kredit qazanılıb</span><span>${S.p.length} kredit hədəf</span></div>
 ${train?"":`<div class="clock"><div id="ck"></div></div>`}
 <div class="q"><h2>${q[1]}</h2>${S.o.map((o,i)=>`<button class="a" data-i="${i}"><kbd>${i+1}</kbd><span>${o.t}</span></button>`).join("")}<div id="fb"></div></div>`;
 app.querySelectorAll(".a").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
 clearInterval(tm);
 if(!train){tl=Date.now();tm=setInterval(()=>{S.left=Math.max(0,60-(Date.now()-tl)/1000);const c=$("#ck");if(c)c.style.width=S.left/60*100+"%";if(S.left<=0)pick(-1)},100)}
}
function pick(j){
 if(S.done)return;S.done=true;clearInterval(tm);
 const q=Q[S.p[S.i]],ok=j>=0&&S.o[j].ok;S.tp=S.tp||Array(12).fill(0);S.tp[q[0]*2+1]++;if(ok)S.tp[q[0]*2]++;
 let msg;
 if(ok){const b=train?0:Math.round(S.left/6),s=Math.min(S.st,5)*2;S.pts+=10+b+s;S.cr++;S.st++;msg=`<strong class="g">Düzgün.</strong> +${10+b+s} xal${S.st>1?`, ${S.st} ardıcıl cavab`:""}. <span class="mute">Bənd ${q[6]}</span>`}
 else{S.debt++;S.st=0;S.bad.push(S.p[S.i]);msg=`<strong class="r">${j<0?"Vaxt bitdi.":"Səhv."}</strong> Düzgün cavab: ${q[2]}. <span class="mute">Bənd ${q[6]}</span>`}
 app.querySelectorAll(".a").forEach((b,i)=>{b.disabled=true;if(S.o[i].ok)b.classList.add("ok");else if(i==j)b.classList.add("no")});
 $("#fb").innerHTML=`<div class="fb"><p>${msg}</p><p class="ex"><b>İzah:</b> ${E[S.p[S.i]]}</p><button class="btn" id="nx">${S.i+1>=S.p.length?"Nəticəyə bax":"Növbəti sual"}</button></div>`;
 $("#nx").onclick=()=>{S.i++;ask()};$("#nx").focus();
}
function end(){
 clearInterval(tm);
 const n=S.i,acc=n?Math.round(S.cr/n*100):0,stopped=!train&&S.debt>=3&&S.i<S.p.length;
 const rank=acc>=90?"Kredit Ustası":acc>=70?"Təcrübəli tələbə":acc>=50?"Yaxşı başlanğıc":"Qaydaları təkrarlayın";
 const rec=saveAttempt();
 app.innerHTML=`<h2>${stopped?"Sessiya bitdi: 3 akademik borc":"Sessiya tamamlandı"}</h2>
 <p class="big">${S.pts}</p><p class="mute">xal${rec?" — yeni şəxsi rekord!":""}</p>
 <p><b>${rank}</b>. ${S.cr} düzgün cavab, ${n} sualdan ${acc} faiz.</p>
 <div class="row" style="margin:14px 0"><button class="btn" id="again">Yenidən oyna</button>${S.bad.length?`<button class="btn ghost" id="rp">Səhvləri təkrarla</button>`:""}</div>
 ${S.bad.length?`<h2 style="margin-top:20px">Səhv cavablanan suallar</h2>${S.bad.map(i=>`<div class="rev"><p>${Q[i][1]}</p><p>${Q[i][2]} <span class="mute">(bənd ${Q[i][6]})</span></p><p class="mute">${E[i]}</p></div>`).join("")}`:"<p>Heç bir səhv yoxdur.</p>"}`;
 $("#again").onclick=menu;
 const rp=$("#rp");if(rp)rp.onclick=()=>{const p=shuf(S.bad);S={p,i:0,pts:0,cr:0,debt:0,st:0,bad:[],left:20,done:false,rp:1};ask()};
}
document.addEventListener("keydown",e=>{
 if(!S||S.done&&e.key!=="Enter")return;
 const k=+e.key;if(k>=1&&k<=4&&app.querySelector(".a")&&!S.done)pick(k-1);
});
function bestPts(){return +LS.get("kum_best")||0}
function nav(){return ""}
function saveAttempt(){if(train||S.rp||!S.i)return false;const b=bestPts(),rec=b>0&&S.pts>b;if(S.pts>b)LS.set("kum_best",S.pts);return rec}
menu();
</script>
</body>
</html>
